- id: "internalized"
  number: "01"
  label: "Internalized reasoning"
  slug: "internalized-reasoning"
  url: "/topics/internalized-reasoning/"
  definition: "Methods that learn from readable chains of thought and then distill, compress, or progressively remove intermediate text so reasoning is carried by internal computation."
  question: "How can an explicit chain of thought be distilled or progressively removed?"
  questions:
    - "What supervision transfers an explicit reasoning trace into hidden computation?"
    - "How much visible reasoning can be removed without losing capability?"
    - "When does internalization improve efficiency, generalization, or control?"
  related_terms:
    - "implicit chain-of-thought"
    - "internalized chain-of-thought"
    - "reasoning distillation"

- id: "learned-tokens"
  number: "02"
  label: "Thinking tokens"
  slug: "thinking-tokens"
  url: "/topics/thinking-tokens/"
  definition: "Methods that use pause, filler, planning, compressed, or learned discrete tokens as computational positions without requiring every token to express a human-readable step."
  question: "Can non-readable token positions provide useful computation or planning?"
  questions:
    - "What can a model compute in token positions that carry little or no readable content?"
    - "Should thinking tokens be fixed, learned, compressed, or dynamically allocated?"
    - "How do extra token positions trade inference cost for capability?"
  related_terms:
    - "pause tokens"
    - "filler tokens"
    - "planning tokens"
    - "compressed tokens"

- id: "continuous"
  number: "03"
  label: "Continuous states"
  slug: "continuous-states"
  url: "/topics/continuous-states/"
  definition: "Methods that carry intermediate computation through hidden activations, continuous thoughts, soft token mixtures, concepts, or other dense representations."
  question: "What changes when intermediate reasoning remains in a dense representation?"
  questions:
    - "Which continuous representation should carry intermediate information?"
    - "How should continuous states be trained, decoded, or supervised?"
    - "Do dense reasoning states improve search, compression, or expressivity?"
  related_terms:
    - "continuous chain-of-thought"
    - "continuous thought"
    - "hidden-state reasoning"
    - "latent-space reasoning"

- id: "recurrent"
  number: "04"
  label: "Recurrent and stateful compute"
  slug: "recurrent-reasoning"
  url: "/topics/recurrent-reasoning/"
  definition: "Methods that spend additional computation through looped depth, dynamic halting, hierarchical recurrence, memory, key/value-cache state, or related stateful mechanisms."
  question: "Can a model adapt how much internal depth it spends on each problem?"
  questions:
    - "How should a model decide when to continue or halt internal computation?"
    - "What state should persist across recurrent steps?"
    - "Can recurrence yield systematic gains beyond simply scaling model depth?"
  related_terms:
    - "recurrent reasoning"
    - "looped transformers"
    - "adaptive computation"
    - "stateful reasoning"

- id: "beyond-sequential"
  number: "05"
  label: "Alternative reasoning schedules"
  slug: "alternative-reasoning-schedules"
  url: "/topics/alternative-reasoning-schedules/"
  definition: "Methods that change the schedule of reasoning through diffusion, parallel refinement, search, hierarchy, next-block prediction, or other non-left-to-right processes."
  question: "What becomes possible beyond strictly left-to-right generation?"
  questions:
    - "Which reasoning steps can be computed or refined in parallel?"
    - "How do alternative schedules represent dependencies between intermediate steps?"
    - "When do non-autoregressive processes improve quality or efficiency?"
  related_terms:
    - "parallel reasoning"
    - "diffusion reasoning"
    - "non-autoregressive reasoning"
    - "next-block prediction"

- id: "analysis"
  number: "06"
  label: "Analysis, evaluation, and limits"
  slug: "implicit-reasoning-evaluation"
  url: "/topics/implicit-reasoning-evaluation/"
  definition: "Work that tests whether internal computation is capable, efficient, faithful, interpretable, robust, and distinguishable from memorization or shortcuts."
  question: "What computation do these systems perform, and how can we tell?"
  questions:
    - "What evidence distinguishes internal reasoning from shortcuts or memorization?"
    - "How faithful are readable explanations to the model's internal computation?"
    - "Which capabilities, limits, and safety properties can be measured reliably?"
  related_terms:
    - "reasoning evaluation"
    - "mechanistic interpretability"
    - "faithfulness"
    - "latent reasoning analysis"
