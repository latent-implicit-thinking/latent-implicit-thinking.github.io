- id: "internalized"
  number: "01"
  label: "Internalized reasoning"
  slug: "internalized-reasoning"
  url: "/topics/internalized-reasoning/"
  short_description: "Learn from worked solutions, then answer with fewer or no written intermediate steps."
  definition: "Learn from worked solutions so that some or all of the reasoning can later happen without writing those steps. Training may use a separate teacher model or progressively remove written steps from the model being trained."
  example: "A teacher model solves a problem in several written steps. A student model learns to produce the answer directly, using information from the teacher's intermediate reasoning during training."
  question: "How can an explicit chain of thought be distilled or progressively removed?"
  questions:
    - "What supervision transfers an explicit reasoning trace into hidden computation?"
    - "How much visible reasoning can be removed without losing capability?"
    - "When does internalization improve efficiency, generalization, or control?"
  related_terms:
    - "implicit chain-of-thought"
    - "internalized chain-of-thought"
    - "reasoning distillation"

- id: "learned-tokens"
  number: "02"
  label: "Thinking tokens"
  slug: "thinking-tokens"
  url: "/topics/thinking-tokens/"
  short_description: "Add pauses or special tokens that give the model more computation without spelling out a solution."
  definition: "Give a model extra tokens for computation, such as pauses, filler symbols, or learned planning tokens. These tokens need not spell out the solution."
  example: "A model processes several pause tokens before answering a math question. Those extra positions let it perform additional computation, even though they do not display a worked solution."
  question: "Can non-readable token positions provide useful computation or planning?"
  questions:
    - "What can a model compute in token positions that carry little or no readable content?"
    - "Should thinking tokens be fixed, learned, compressed, or dynamically allocated?"
    - "How do extra token positions trade inference cost for capability?"
  related_terms:
    - "pause tokens"
    - "filler tokens"
    - "planning tokens"
    - "compressed tokens"

- id: "continuous"
  number: "03"
  label: "Continuous-state reasoning"
  slug: "continuous-states"
  url: "/topics/continuous-states/"
  short_description: "Pass vectors between reasoning steps instead of choosing a text token at every step."
  definition: "Use vectors—lists of numbers—to carry intermediate reasoning from one step to the next, instead of selecting a text token at every step. Some methods use the model's hidden states; others combine several candidate token representations."
  example: "A model feeds its current hidden-state vector back as the next input. It repeats this several times before returning to text to produce an answer."
  question: "What changes when intermediate reasoning remains in a dense representation?"
  questions:
    - "Which continuous representation should carry intermediate information?"
    - "How should continuous states be trained, decoded, or supervised?"
    - "Do dense reasoning states improve search, compression, or expressivity?"
  related_terms:
    - "continuous chain-of-thought"
    - "continuous thought"
    - "hidden-state reasoning"
    - "latent-space reasoning"

- id: "recurrent"
  number: "04"
  label: "Recurrent reasoning"
  slug: "recurrent-reasoning"
  url: "/topics/recurrent-reasoning/"
  short_description: "Reuse model layers or carry information in memory to spend more computation on a problem."
  definition: "Repeat parts of the model or keep intermediate information in memory while working through a problem. Some methods also learn how many passes to run."
  example: "A model runs the same layers several times, updating the information it keeps between passes. If it has learned a stopping rule, it can decide when to produce its answer."
  question: "Can a model adapt how much internal depth it spends on each problem?"
  questions:
    - "How should a model decide when to continue or halt internal computation?"
    - "What state should persist across recurrent steps?"
    - "Can recurrence yield systematic gains beyond simply scaling model depth?"
  related_terms:
    - "recurrent reasoning"
    - "looped transformers"
    - "adaptive computation"
    - "stateful reasoning"

- id: "beyond-sequential"
  number: "05"
  label: "Alternative generation methods"
  slug: "alternative-reasoning-schedules"
  url: "/topics/alternative-reasoning-schedules/"
  short_description: "Change how steps are generated—for example, by refining several together. Some methods still use written reasoning."
  definition: "Change how intermediate steps are generated, revised, or searched—for example, by refining several steps in parallel. These are related approaches: some still produce written chains of thought."
  example: "A diffusion model refines representations of a solution over several rounds, rather than committing to each word in left-to-right order. The final reasoning can still be readable text."
  question: "What becomes possible beyond strictly left-to-right generation?"
  questions:
    - "Which reasoning steps can be computed or refined in parallel?"
    - "How do alternative schedules represent dependencies between intermediate steps?"
    - "When do non-autoregressive processes improve quality or efficiency?"
  related_terms:
    - "parallel reasoning"
    - "diffusion reasoning"
    - "non-autoregressive reasoning"
    - "next-block prediction"

- id: "analysis"
  number: "06"
  label: "Analysis and evaluation"
  slug: "implicit-reasoning-evaluation"
  url: "/topics/implicit-reasoning-evaluation/"
  short_description: "Test what these methods can do, how they work, and when they fail."
  definition: "Measure how well these methods work, investigate what their internal computation does, and identify where they fail. This includes experiments, studies of model internals, and mathematical results."
  example: "A researcher replaces an intermediate state with one taken from a different problem, then checks how the answer changes. This tests what information that state contributes to the solution."
  question: "What computation do these systems perform, and how can we tell?"
  questions:
    - "What evidence distinguishes internal reasoning from shortcuts or memorization?"
    - "How faithful are readable explanations to the model's internal computation?"
    - "Which capabilities, limits, and safety properties can be measured reliably?"
  related_terms:
    - "reasoning evaluation"
    - "mechanistic interpretability"
    - "faithfulness"
    - "latent reasoning analysis"
