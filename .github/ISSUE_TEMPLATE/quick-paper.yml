name: Quick paper suggestion
description: Suggest a paper with a link and one sentence.
title: "[Quick paper] "
labels: ["paper suggestion"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a paper. A link and a sentence are enough; we can fill in the authors, dates, and categories.
  - type: input
    id: url
    attributes:
      label: Paper link
      description: ArXiv, OpenReview, proceedings, or another official public source.
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: textarea
    id: fit
    attributes:
      label: Why it may fit
      description: One sentence is enough.
      placeholder: This paper studies...
    validations:
      required: true
