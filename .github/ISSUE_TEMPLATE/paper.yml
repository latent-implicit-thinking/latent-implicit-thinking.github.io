name: Detailed paper suggestion
description: Suggest a paper with its authors, dates, and other details.
title: "[Paper] "
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a paper. This form is for detailed submissions; the Quick paper suggestion form needs only a link and a sentence.
  - type: input
    id: title
    attributes:
      label: Paper title
      placeholder: Title as shown on the paper
    validations:
      required: true
  - type: textarea
    id: authors
    attributes:
      label: Authors
      description: Use the order shown on the earliest public version.
    validations:
      required: true
  - type: input
    id: paper_url
    attributes:
      label: Paper URL
      description: ArXiv, OpenReview, proceedings, or another canonical public source.
      placeholder: https://arxiv.org/abs/...
    validations:
      required: true
  - type: input
    id: first_public
    attributes:
      label: Earliest public date
      description: YYYY-MM-DD, with a source if it is not visible at the paper URL.
      placeholder: YYYY-MM-DD
    validations:
      required: true
  - type: input
    id: code_url
    attributes:
      label: Verified code or project URL
      placeholder: https://github.com/...
  - type: textarea
    id: fit
    attributes:
      label: Why it belongs on the list
      description: Explain the connection to implicit chain-of-thought in one or two sentences.
    validations:
      required: true
  - type: dropdown
    id: family
    attributes:
      label: Closest category (optional)
      options:
        - Internalized reasoning
        - Thinking tokens
        - Continuous-state reasoning
        - Recurrent reasoning
        - Alternative generation methods
        - Analysis and evaluation
        - Unsure or spans several categories
  - type: textarea
    id: notes
    attributes:
      label: Additional context
      description: Optional venue, related records, or classification notes.
